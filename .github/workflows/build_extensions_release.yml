name: Build and publish Korean extensions

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: 'all 또는 빌드할 모듈명 목록 예: xtoon ntk'
        required: false
        default: all
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'core/**'
      - 'common/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/**'
      - '.github/workflows/build_extensions_release.yml'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXTENSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.extensions || 'all' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signingkey.jks

      - name: Resolve extension build tasks
        id: tasks
        run: |
          TASKS=$(python3 scripts/list_extensions.py --gradle-tasks --extensions "$EXTENSIONS")
          if [ -z "$TASKS" ]; then
            echo "No extension build tasks resolved" >&2
            exit 1
          fi
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Resolved tasks: $TASKS"

      - name: Build release APKs
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ steps.tasks.outputs.tasks }}

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: oneulddu/Korean-Mihon-Extensions
          ref: repo
          path: deploy
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Update deployment repository files
        run: |
          python3 scripts/update_repo.py \
            --source-dir "$GITHUB_WORKSPACE" \
            --deploy-dir "$GITHUB_WORKSPACE/deploy" \
            --extensions "$EXTENSIONS"

      - name: Commit and push deployment repository
        run: |
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html index.json index.min.json repo.json apk icon
          if git diff --cached --quiet; then
            echo "No deployment changes"
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          SOURCE_REF="${GITHUB_REF_NAME:-unknown}"
          git commit \
            -m "chore: 한국어 확장 배포 갱신 (${SOURCE_REF}@${SHORT_SHA})" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin repo
