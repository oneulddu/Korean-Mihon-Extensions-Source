name: Build and publish Korean extensions

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: 'all 또는 빌드할 모듈명 목록 예: xtoon ntk'
        required: false
        default: all
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'core/**'
      - 'common/**'
      - 'lib/**'
      - 'lib-multisrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/**'
      - '.github/workflows/build_extensions_release.yml'

concurrency:
  group: korean-extensions-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXTENSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.extensions || 'all' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve extension build tasks
        id: tasks
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_EXTENSIONS=$(python3 scripts/list_extensions.py --names --extensions "$EXTENSIONS")
            TASKS=$(python3 scripts/list_extensions.py --gradle-tasks --extensions "$EXTENSIONS")
          else
            SELECTED_EXTENSIONS=$(python3 scripts/list_extensions.py --names --changed-from "${{ github.event.before }}" --changed-to "${{ github.sha }}")
            TASKS=$(python3 scripts/list_extensions.py --gradle-tasks --changed-from "${{ github.event.before }}" --changed-to "${{ github.sha }}")
          fi

          if [ -z "$TASKS" ]; then
            echo "No changed extensions to build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "selected_extensions=$SELECTED_EXTENSIONS" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Selected extensions: $SELECTED_EXTENSIONS"
          echo "Resolved tasks: $TASKS"

      - name: Set up JDK
        if: steps.tasks.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        if: steps.tasks.outputs.should_build == 'true'
        uses: android-actions/setup-android@v4

      - name: Restore signing key
        if: steps.tasks.outputs.should_build == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signingkey.jks

      - name: Build release APKs
        if: steps.tasks.outputs.should_build == 'true'
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_SELECTED_EXTENSIONS: ${{ steps.tasks.outputs.selected_extensions }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ${{ steps.tasks.outputs.tasks }}

      - name: Checkout deployment repository
        if: steps.tasks.outputs.should_build == 'true'
        uses: actions/checkout@v6
        with:
          repository: oneulddu/Korean-Mihon-Extensions
          ref: repo
          path: deploy
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Update deployment repository files
        if: steps.tasks.outputs.should_build == 'true'
        run: |
          python3 scripts/update_repo.py \
            --source-dir "$GITHUB_WORKSPACE" \
            --deploy-dir "$GITHUB_WORKSPACE/deploy" \
            --extensions "${{ steps.tasks.outputs.selected_extensions }}"

      - name: Commit and push deployment repository
        if: steps.tasks.outputs.should_build == 'true'
        run: |
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json repo.json apk icon README.md
          if git diff --cached --quiet; then
            echo "No deployment changes"
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          SOURCE_REF="${GITHUB_REF_NAME:-unknown}"
          SOURCE_COMMIT_MESSAGE="$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%B "$GITHUB_SHA")"
          SOURCE_COMMIT_SUBJECT="$(printf '%s\n' "$SOURCE_COMMIT_MESSAGE" | sed -n '1p')"
          if printf '%s\n' "$SOURCE_COMMIT_SUBJECT" | grep -q '^Merge pull request #'; then
            MERGE_PR_TITLE="$(printf '%s\n' "$SOURCE_COMMIT_MESSAGE" | awk 'NF { count += 1; if (count == 2) { print; exit } }')"
            if [ -n "$MERGE_PR_TITLE" ]; then
              SOURCE_COMMIT_SUBJECT="$MERGE_PR_TITLE"
            fi
          fi
          if [ -z "$SOURCE_COMMIT_SUBJECT" ]; then
            SOURCE_COMMIT_SUBJECT="chore: 한국어 확장 배포 갱신"
          fi
          git commit \
            -m "$SOURCE_COMMIT_SUBJECT" \
            -m "Deploy: ${SOURCE_REF}@${SHORT_SHA}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin repo

      - name: Sync source README extension table
        # 빌드/배포가 성공한 뒤에만 실행한다. push 이벤트에서 실제로 빌드가 돌아
        # 배포가 갱신된 경우에만 소스 README의 배포 상태 표를 게시한다.
        # (빌드 실패 시 이 스텝은 건너뛰므로 README가 미배포 확장을 배포됨으로 표기하지 않는다.)
        if: github.event_name == 'push' && steps.tasks.outputs.should_build == 'true'
        # 문서 동기화 실패가 이미 끝난 릴리스를 실패로 만들지 않도록 격리한다.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 빌드 워킹트리를 오염시키지 않도록 README 커밋/푸시는 별도 워크트리에서 처리한다.
          # main이 그사이 진행돼 non-fast-forward가 나도 refetch 후 재시도로 흡수하고,
          # 끝내 실패하면 경고만 남긴다(다음 push 실행에서 다시 동기화됨).
          SYNC_DIR="$(mktemp -d)"
          git worktree add --detach "$SYNC_DIR" "origin/${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git -C "$SYNC_DIR" fetch origin "${GITHUB_REF_NAME}"
            git -C "$SYNC_DIR" reset --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/update_source_readme.py \
              --source-dir "$GITHUB_WORKSPACE" \
              --readme "$SYNC_DIR/README.md"
            if git -C "$SYNC_DIR" diff --quiet -- README.md; then
              echo "Source README already up to date on remote"
              break
            fi
            git -C "$SYNC_DIR" add README.md
            git -C "$SYNC_DIR" commit -m "docs: 확장 목록 표 자동 갱신"
            if git -C "$SYNC_DIR" push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed source README update (attempt ${attempt})"
              break
            fi
            echo "::warning::Push rejected (attempt ${attempt}); refetching and retrying"
          done
          git worktree remove --force "$SYNC_DIR" || true
