ext {
    extName = 'GoodToon'
    extClass = '.GoodToon'
    extVersionCode = 2
    isNsfw = true
}

apply plugin: "kei.plugins.extension.legacy"


android {
    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        test {
            java.srcDirs = ['test']
            kotlin.srcDirs = ['test']
            resources.srcDirs = ['test/resources']
        }
    }
}

dependencies {
    testImplementation libs.bundles.common
    testImplementation libs.junit
}
